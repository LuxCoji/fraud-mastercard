<title>Fraud Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* A dealing-room terminal is a committed visual world - it has no light mode,
   so every colour is painted explicitly rather than left to the host ground.
   Severity is warm and the accent is cool, so a status pill can never be
   mistaken for a traced flow. */
:root {
  --ground:   #0a0d12;
  --panel:    #111721;
  --panel-2:  #161d29;
  --line:     #1e2634;
  --line-lit: #2b3648;
  --ink:      #d5dce6;
  --ink-mid:  #97a3b2;
  --ink-dim:  #6f7c8b;
  --flow:     #5fa8d3;
  --flow-dim: #2d5a75;
  --ok:       #4c9a5a;
  --warn:     #c9a227;
  --crit:     #d2504f;

  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;

  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 20px;
  padding: 0 18px; height: 46px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--mono); font-weight: 600; font-size: 12px;
  letter-spacing: 0.14em; text-transform: uppercase;
}
.brand span { color: var(--flow); }

nav { display: flex; gap: 2px; margin-left: 8px; }
nav button {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-dim);
  background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 14px 14px 12px; cursor: pointer;
}
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--flow); }
nav button:focus-visible { outline: 2px solid var(--flow); outline-offset: -2px; }

.status { margin-left: auto; display: flex; align-items: center; gap: 16px;
          font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
       display: inline-block; margin-right: 6px; vertical-align: middle; }

/* ---------- layout ---------- */
main { padding: 16px 18px 60px; max-width: 1420px; }
[hidden] { display: none !important; }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
         gap: 1px; background: var(--line); border: 1px solid var(--line);
         margin-bottom: 16px; }
.stat { background: var(--panel); padding: 11px 13px; }
.stat .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.11em;
           text-transform: uppercase; color: var(--ink-dim); }
.stat .v { font-family: var(--mono); font-size: 21px; font-variant-numeric: tabular-nums;
           margin-top: 3px; }
.stat .s { font-size: 11px; color: var(--ink-dim); margin-top: 1px; }

/* ---------- queue table ---------- */
.tablewrap { border: 1px solid var(--line); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
thead th {
  position: sticky; top: 46px; z-index: 10;
  background: var(--panel-2); text-align: left; font-weight: 500;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-dim); padding: 8px 12px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; }
tbody tr:hover { background: var(--panel); }
tbody tr[aria-expanded="true"] { background: var(--panel-2); }
tbody tr:focus-visible { outline: 2px solid var(--flow); outline-offset: -2px; }
td { padding: 8px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.shape { color: var(--ink-mid); }
.rank { color: var(--ink-dim); width: 34px; }

.tag { display: inline-block; padding: 1px 7px; font-size: 10px;
       letter-spacing: 0.06em; border: 1px solid var(--line-lit);
       color: var(--ink-mid); }
.tag.cyc { border-color: var(--flow-dim); color: var(--flow); }
.tag.none { color: var(--ink-dim); border-style: dashed; }

.bar { display: inline-block; height: 3px; background: var(--flow);
       vertical-align: middle; margin-left: 8px; }

/* ---------- expanded case ---------- */
.detail td { padding: 0; }
.detailbox { padding: 18px 20px 20px; background: var(--ground);
             border-top: 1px solid var(--line); }
.detailhead { display: flex; flex-wrap: wrap; gap: 26px; margin-bottom: 16px; }
.detailhead div span { display: block; font-family: var(--mono); font-size: 10px;
                       letter-spacing: 0.1em; text-transform: uppercase;
                       color: var(--ink-dim); margin-bottom: 2px; }
.detailhead div b { font-family: var(--mono); font-weight: 500; font-size: 14px;
                    font-variant-numeric: tabular-nums; }

.flowlabel { font-family: var(--mono); font-size: 10px; letter-spacing: 0.11em;
             text-transform: uppercase; color: var(--ink-dim);
             margin: 18px 0 10px; }

/* The path diagram - the thing this system produces that a generic console
   cannot. Accounts as nodes, the money as the line between them. */
.path { display: flex; align-items: center; flex-wrap: wrap; gap: 0;
        padding: 12px 0; }
.node { font-family: var(--mono); font-size: 11px; padding: 5px 9px;
        border: 1px solid var(--line-lit); background: var(--panel);
        white-space: nowrap; }
.node.origin { border-color: var(--flow); color: var(--flow); }
.node.repeat { border-style: dashed; color: var(--flow); border-color: var(--flow-dim); }
.hop { display: flex; align-items: center; color: var(--flow-dim); }
.hop svg { display: block; }
.flowmeta { font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
            padding-left: 2px; }
.flowmeta b { color: var(--ink-mid); font-weight: 500; }

.actions { display: flex; gap: 8px; margin-top: 20px;
           padding-top: 16px; border-top: 1px solid var(--line); }
.actions button {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 7px 15px; cursor: pointer;
  background: none; border: 1px solid var(--line-lit); color: var(--ink-mid);
}
.actions button:hover { border-color: var(--ink-dim); color: var(--ink); }
.actions button.primary { border-color: var(--crit); color: var(--crit); }
.actions button.primary:hover { background: var(--crit); color: var(--ground); }
.actions button:focus-visible { outline: 2px solid var(--flow); outline-offset: 2px; }

/* ---------- monitor ---------- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
         gap: 14px; }
.card { border: 1px solid var(--line); background: var(--panel); }
.card h2 { margin: 0; padding: 10px 14px; font-family: var(--mono);
           font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
           color: var(--ink-dim); font-weight: 500;
           border-bottom: 1px solid var(--line); }
.card .body { padding: 14px; }
.row { display: flex; justify-content: space-between; align-items: baseline;
       padding: 6px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .l { color: var(--ink-dim); font-size: 12px; }
.row .r { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; }

.pill { display: inline-block; font-family: var(--mono); font-size: 10px;
        letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 7px;
        border: 1px solid currentColor; }
.pill.ok { color: var(--ok); } .pill.watch { color: var(--ink-mid); }
.pill.warn { color: var(--warn); } .pill.critical { color: var(--crit); }

.note { font-size: 12px; color: var(--ink-dim); line-height: 1.6;
        border-left: 2px solid var(--line-lit); padding-left: 12px; margin: 14px 0 0; }
.note b { color: var(--ink-mid); font-weight: 500; }

footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line);
         font-size: 11px; color: var(--ink-dim); line-height: 1.7; }
footer code { font-family: var(--mono); color: var(--ink-mid); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<header>
  <div class="brand">FRAUD<span>OPS</span></div>
  <nav role="tablist">
    <button role="tab" id="tab-queue" aria-selected="true" aria-controls="p-queue">Queue</button>
    <button role="tab" id="tab-monitor" aria-selected="false" aria-controls="p-monitor">Monitor</button>
  </nav>
  <div class="status">
    <span><span class="dot"></span>live</span>
    <span id="gen"></span>
  </div>
</header>

<main>
  <section id="p-queue" role="tabpanel" aria-labelledby="tab-queue">
    <div class="strip" id="qstats"></div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th class="rank">#</th><th>Structure</th><th>Value</th><th>Accounts</th>
            <th>Score</th><th>Age</th><th>Traced path</th>
          </tr>
        </thead>
        <tbody id="qbody"></tbody>
      </table>
    </div>
    <p class="note" id="qnote"></p>
  </section>

  <section id="p-monitor" role="tabpanel" aria-labelledby="tab-monitor" hidden>
    <div class="strip" id="mstats"></div>
    <div class="grid2" id="mgrid"></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
/* Account ids, model names and drift details all originate in CSV columns and
   JSON artifacts. A single "<" in any of them silently corrupts the DOM. */
const esc = v => String(v).replace(/[&<>"']/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = n => n.toLocaleString("en-IN");
const pct = n => (n * 100).toFixed(1) + "%";

/* ---------- tabs ---------- */
document.querySelectorAll('[role="tab"]').forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll('[role="tab"]').forEach(t => {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      $("#" + t.getAttribute("aria-controls")).hidden = !on;
    });
  });
});

/* ---------- queue ---------- */
const q = DATA.queue;
const traced = q.filter(c => c.flows.length || c.fans.length).length;
const real = q.filter(c => c.actually_laundering).length;
const top20 = q.slice(0, 20).filter(c => c.actually_laundering).length;
/* The queue is ordered by score, so q[0] is the highest-scoring case and not
   the largest. They differ by 8x in the shipped data. */
const largest = q.reduce((a, c) => c.value > a.value ? c : a);

$("#qstats").innerHTML = [
  ["Open cases", q.length, "wire rail, 1% alert budget"],
  ["Top 20 hit rate", Math.round(top20 / 20 * 100) + "%", top20 + " of 20 are laundering"],
  ["Queue hit rate", Math.round(real / q.length * 100) + "%", real + " of " + q.length],
  ["With traced path", traced, "of " + q.length + " cases"],
  ["Largest case", "₹ " + largest.value_label,
    largest.accounts + " accounts, ranked #" + (q.indexOf(largest) + 1)],
].map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div>
  <div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

const shapeOf = c => {
  const m = c.evidence.match(/^([A-Z-]+)/);
  return m ? m[1] : "NONE";
};

const pathDiagram = f => {
  const seen = {};
  const parts = f.path.map((a, i) => {
    seen[a] = (seen[a] || 0) + 1;
    const cls = i === 0 ? "node origin"
      : (seen[a] > 1 ? "node repeat" : "node");
    const hop = i < f.path.length - 1
      ? `<span class="hop"><svg width="30" height="8" aria-hidden="true">
           <line x1="0" y1="4" x2="23" y2="4" stroke="currentColor" stroke-width="1"/>
           <path d="M23 1 L29 4 L23 7 Z" fill="currentColor"/></svg></span>` : "";
    return `<span class="${cls}">${esc(a)}</span>${hop}`;
  }).join("");
  return `<div class="path">${parts}</div>
    <div class="flowmeta">${f.shape === "cycle" ? "Returns to origin" : "Ends elsewhere"} &middot;
      <b>₹${fmt(Math.round(f.amount_in))}</b> first hop,
      <b>₹${fmt(Math.round(f.amount_out))}</b> last
      ${f.out_over_in == null ? "" : `(&times;${f.out_over_in.toFixed(2)})`}
      over <b>${f.span_hours}h</b></div>`;
};

$("#qbody").innerHTML = q.map((c, i) => {
  const shape = shapeOf(c);
  const width = Math.max(4, Math.round(c.score * 46));
  const flows = c.flows.length
    ? c.flows.map(pathDiagram).join('<div style="height:10px"></div>')
    : `<p class="flowmeta">No path could be traced. The model flagged these
       transactions on their own features, not on structure.</p>`;
  const fans = c.fans.map(f => `<div class="flowmeta">Fan-${f.direction} from
      <b>${esc(f.hub)}</b> across <b>${f.counterparties}</b> counterparties,
      ₹${fmt(Math.round(f.total))} in ${f.span_hours}h</div>`).join("");

  return `
  <tr tabindex="0" aria-expanded="false" data-i="${i}">
    <td class="rank num">${i + 1}</td>
    <td class="shape"><span class="tag ${shape === "CYCLE" ? "cyc" : shape === "NONE" ? "none" : ""}">${shape}</span></td>
    <td class="num">₹ ${c.value_label}</td>
    <td class="num">${c.accounts}</td>
    <td class="num">${c.score.toFixed(3)}<span class="bar" style="width:${width}px"></span></td>
    <td class="num">${c.age_hours == null ? "—" : Math.round(c.age_hours) + "h"}</td>
    <td class="num" style="color:var(--ink-dim)">${c.flows.length || (c.fans.length ? "fan" : "—")}</td>
  </tr>
  <tr class="detail" hidden><td colspan="7"><div class="detailbox">
    <div class="detailhead">
      <div><span>Case</span><b>#${c.id}</b></div>
      <div><span>Total value</span><b>₹ ${c.value_label}</b></div>
      <div><span>Accounts</span><b>${c.accounts}</b></div>
      <div><span>Model score</span><b>${c.score.toFixed(4)}</b></div>
      <div><span>Structure</span><b>${esc(c.evidence)}</b></div>
    </div>
    <div class="flowlabel">Traced money flow</div>
    ${flows}${fans}
    <div class="actions">
      <button class="primary">Escalate to freeze</button>
      <button>Clear case</button>
      <button>Request more information</button>
    </div>
  </div></td></tr>`;
}).join("");

const toggle = row => {
  const detail = row.nextElementSibling;
  const open = row.getAttribute("aria-expanded") === "true";
  row.setAttribute("aria-expanded", !open);
  detail.hidden = open;
};
$("#qbody").addEventListener("click", e => {
  const row = e.target.closest("tr[data-i]");
  if (row) toggle(row);
});
$("#qbody").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-i]")) {
    e.preventDefault(); toggle(e.target);
  }
});

$("#qnote").innerHTML = `Ranked by model score, highest first. <b>${top20} of the
  top 20 are real laundering</b> against ${Math.round(real / q.length * 100)}%
  across the whole queue &mdash; which is why the queue is worked downward.
  Cases group alerts that share an account, so one operation is one case rather
  than a dozen rows. <b>Nothing here is frozen automatically:</b> at this rail's
  precision an automatic freeze would stop roughly eight innocent parties per
  real one.`;

/* ---------- monitor ---------- */
const m = DATA.monitor, rails = m.rails;
const worst = m.drift.reduce((a, f) =>
  ({ok: 0, watch: 1, warn: 2, critical: 3}[f.severity] >
   {ok: 0, watch: 1, warn: 2, critical: 3}[a.severity] ? f : a), m.drift[0]);

$("#mstats").innerHTML = [
  ["Card recall", pct(rails.card.recall), "at a " + pct(rails.card.alert_rate) + " alert rate"],
  ["Wire recall", pct(rails.wire.recall), rails.wire.version + ", at " + pct(rails.wire.alert_rate)],
  ["Card p99", rails.card.latency_p99_ms + " ms", "budget 100 ms"],
  ["Wrongly blocked", "1 in " + Math.round(1 / rails.card.genuine_blocked),
    pct(rails.card.genuine_blocked) + " of genuine"],
  ["Drift", worst.severity.toUpperCase(), m.drift.length + " checks"],
].map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div>
  <div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

const railCard = (name, r, extra) => `
  <div class="card"><h2>${name} rail &middot; ${r.version}</h2><div class="body">
    <div class="row"><span class="l">Model</span><span class="r">${esc(r.model)}</span></div>
    <div class="row"><span class="l">Fraud caught</span><span class="r">${pct(r.recall)}</span></div>
    <div class="row"><span class="l">Precision</span><span class="r">${pct(r.precision)}</span></div>
    ${extra}
    <div class="row"><span class="l">Latency p99</span><span class="r">${r.latency_p99_ms} ms</span></div>
    <div class="row"><span class="l">Alert rate</span><span class="r">${pct(r.alert_rate)}</span></div>
    <div class="row"><span class="l">Data source</span><span class="r">${esc(r.source)}</span></div>
  </div></div>`;

$("#mgrid").innerHTML =
  railCard("Card", rails.card,
    `<div class="row"><span class="l">Value caught</span><span class="r">${pct(rails.card.value_recall)}</span></div>
     <div class="row"><span class="l">Genuine blocked</span><span class="r">${pct(rails.card.genuine_blocked)}</span></div>`) +
  railCard("Wire", rails.wire,
    `<div class="row"><span class="l">Automatic freeze</span><span class="r" style="color:var(--ok)">never</span></div>
     <div class="row"><span class="l">Queue scored by</span>
       <span class="r" style="color:var(--warn)">${esc(rails.wire.queue_version)} &middot;
         ${pct(rails.wire.queue_recall)}</span></div>`) +
  `<div class="card"><h2>Drift checks</h2><div class="body">
    ${m.drift.map(f => `<div class="row">
      <span class="l">${esc(f.metric.replace(/_/g, " "))}</span>
      <span class="r"><span class="pill ${esc(f.severity)}">${esc(f.severity)}</span>
        &nbsp;${f.current}</span></div>`).join("")}
    <p class="note">Labels arrive weeks late, so these watch what is available
      now &mdash; the alert rate, the score distribution, the input features.
      <b>The precision estimate is a change detector, not a number to quote:</b>
      measured against truth it read 0.456 where the actual was 0.742.</p>
  </div></div>` +
  `<div class="card"><h2>Model registry</h2><div class="body">
    ${(m.registry.versions || []).map(v => `<div class="row">
      <span class="l">${esc(v.rail)} ${esc(v.version)}${v.active ? " &larr; active" : ""}</span>
      <span class="r">${(v.metrics.recall_at_operating_point * 100).toFixed(1)}%</span>
    </div>`).join("") || '<div class="row"><span class="l">no versions</span></div>'}
    <p class="note">A new version is promoted only if recall at the operating
      point holds. <b>Recall, not PR-AUC</b> &mdash; across three seeds the wire
      rail's PR-AUC varied 36.7% while its recall varied 1.2%, so gating on
      PR-AUC would reject good retrains at random.</p>
  </div></div>`;

$("#gen").textContent = "data " + DATA.generated.replace("T", " ").replace("+00:00", "Z");
$("#foot").innerHTML = `Card rail figures come from IEEE-CIS, real card
  transactions. <b>Wire rail figures come from IBM AML, which is synthetic</b>
  &mdash; checked clean of the artefact that made PaySim unusable, but clean is
  not real. Ground truth is shown in this queue only because it is a held-out
  evaluation set; a live system would not have it.
  Regenerate with <code>python src/models/export_dashboard_data.py</code>.`;
</script>
